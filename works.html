<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"HomeAndConstructionBusiness","name":"サカエ塗装サービス","legalName":"株式会社サカエコーポレーション","telephone":"0120-714-350","address":{"@type":"PostalAddress","postalCode":"189-0014","addressRegion":"東京都","addressLocality":"東村山市","streetAddress":"本町1-6-73 野口橋ビル1F"},"openingHours":"Mo-Su 09:00-20:00","areaServed":["東村山市","小平市","東大和市","清瀬市","東久留米市","西東京市","所沢市"],"description":"創業30年以上、東村山市の外壁塗装・屋根塗装・防水工事の会社"}

<script src="site.js"></script>
</head>
<body>
<div id="head"></div>
<main>
<section class="page-head"><div class="page-head-bg" aria-hidden="true"></div><div class="wrap"><p class="crumb"><a href="index.html">トップ</a> / 施工事例</p><h1>施工事例</h1><p>これまでに手がけた建物の中から、ご紹介します。</p></div></section>
<script>
function pricedCard(p){
  return '<article class="pcard"><span class="area">'+p[0]+'</span><h3>'+p[1]+'</h3><p class="yen">'+p[6]+'<small>'+p[2]+'</small></p>'+
  '<dl><dt>塗料</dt><dd>'+p[3]+'</dd><dt>工期</dt><dd>'+p[4]+'</dd><dt>完工</dt><dd>'+p[5]+'</dd></dl></article>';
}
function workCard(w){
  var ph = function(f){ return f ? '<div class="photo"><img loading="lazy" src="'+IMG+f+'" onerror="fallback(this)" alt="'+w[0]+' '+w[1]+'の施工写真"></div>' : ''; };
  return '<article class="work"><div class="pair'+(w[3]?'':' single')+'">'+ph(w[2])+ph(w[3])+'</div><span class="area">'+w[0]+'</span><h3>'+w[1]+'</h3></article>';
}
</script>

<section class="sec tint">
  <div class="wrap">
    <div class="sec-head"><h2>価格つきの施工事例</h2></div>
    <div class="priced" id="priced"></div>
  </div>
</section>
<section class="sec">
  <div class="wrap">
    <div class="sec-head"><h2>施工写真</h2></div>
    <div class="filter" role="group" aria-label="地域でしぼりこむ">
      <button aria-pressed="true" data-a="all">すべて</button>
      <button aria-pressed="false" data-a="東村山市">東村山市</button>
      <button aria-pressed="false" data-a="所沢市">所沢市</button>
      <button aria-pressed="false" data-a="国分寺市">国分寺市</button>
      <button aria-pressed="false" data-a="東久留米市">東久留米市</button>
      <button aria-pressed="false" data-a="other">そのほかの地域</button>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="works" id="all"></div>
  </div>
</section>
<script>
document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("priced").innerHTML=PRICED.map(pricedCard).join("");
  var main=["東村山市","所沢市","国分寺市","東久留米市"];
  function show(a){
    var list=WORKS.filter(function(w){return a==="all"||(a==="other"?main.indexOf(w[0])<0:w[0]===a)});
    document.getElementById("all").innerHTML=list.map(workCard).join("");
    document.getElementById("count").textContent=list.length+"件を表示しています";
  }
  document.querySelectorAll(".filter button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".filter button").forEach(function(x){x.setAttribute("aria-pressed","false")});
      b.setAttribute("aria-pressed","true"); show(b.dataset.a);
    });
  });
  show("all");
});
</script>

</main>
<div id="foot"></div>
</body>
</html>
